{% extends "base.html" %}
{% block title %}Login Admin{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-4">
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title mb-3">Login Admin</h5>
        <form method="post">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input class="form-control" name="username" autofocus required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input class="form-control" type="password" name="password" required>
          </div>
          <button class="btn btn-primary w-100">Masuk</button>
        </form>
        <p class="small text-muted mt-3 mb-0">
          Default pertama: <code>admin</code> / <code>admin</code> &mdash; segera ganti dari halaman Admin.
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
